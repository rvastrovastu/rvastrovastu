<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by `flutter build web --base-href`. The website serves the app
    under /app/, so tools/build_web.sh builds with --base-href /app/.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RV Astro Vastu: Kundli, Panchang, Horoscope and Vastu</title>
  <meta name="description" content="Your family's honest astrologer on the web: daily horoscope, Kundli, Dasha, Panchang, Muhurat, festivals, matching and Vastu from your own chart, in 11 languages. No fear, no meter.">
  <meta name="theme-color" content="#0d1033">
  <link rel="canonical" href="https://www.rvastrovastu.com/app/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RV Astro Vastu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0d1033; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #f7cf78; font: 600 18px/1.4 -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Noto Sans", sans-serif;
      transition: opacity .3s ease;
    }
    #splash img {
      width: 112px; height: 112px; border-radius: 50%;
      box-shadow: 0 0 48px rgba(240, 180, 60, .35);
      animation: glow 1.6s ease-in-out infinite alternate;
    }
    #splash small { color: #b9b3c9; font-weight: 400; font-size: 14px; }
    @keyframes glow { from { transform: scale(.97); } to { transform: scale(1.03); } }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>RV Astro Vastu</div>
    <small>Opening your chart…</small>
  </div>

  <!--
    swisseph.js + swisseph.wasm (Swiss Ephemeris as WebAssembly, from the
    swisseph package) sit next to this page; wasm_ffi fetches them on the
    first chart. tools/build_web.sh copies them in.
  -->
  <script>
    // Hide the splash once Flutter draws its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
